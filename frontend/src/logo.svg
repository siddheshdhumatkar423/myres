<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>React Logo SVG</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841.9 595.3" width="200" height="200">
    <g fill="#61DAFB">
      <!-- Central circle -->
      <circle cx="420.9" cy="296.5" r="45.7"/>
      <!-- Orbit lines -->
      <g stroke="#61DAFB" stroke-width="15" fill="none">
        <ellipse rx="165" ry="380" cx="420.9" cy="296.5" transform="rotate(60 420.9 296.5)"/>
        <ellipse rx="165" ry="380" cx="420.9" cy="296.5" transform="rotate(120 420.9 296.5)"/>
        <ellipse rx="165" ry="380" cx="420.9" cy="296.5"/>
      </g>
    </g>
  </svg>
</body>
</html>
